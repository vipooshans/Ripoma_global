<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5f6d"/>
      <stop offset="50%" stop-color="#ffc371"/>
      <stop offset="100%" stop-color="#7be495"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- base circle with gradient -->
  <circle cx="32" cy="32" r="28" fill="url(#g1)" filter="url(#f1)"/>

  <!-- overlay crescent to add contrast -->
  <path d="M44 20 A16 16 0 1 1 28 52 A12 12 0 1 0 44 20 Z" fill="url(#g2)" opacity="0.92"/>

  <!-- subtle center mark -->
  <circle cx="32" cy="32" r="8" fill="#ffffff" opacity="0.12"/>

  <!-- initials RG -->
  <g transform="translate(22,22) scale(1.4)" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10">
    <text x="0" y="8">R</text>
    <text x="12" y="8">G</text>
  </g>
</svg>
