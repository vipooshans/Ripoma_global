<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RIPOMA GLOBAL Notification Digest</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      color: #334155;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background-color: #0F172A;
      padding: 24px;
      text-align: center;
      border-bottom: 3px solid #0D9488;
    }
    .header-logo {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
    }
    .header-logo span {
      color: #0D9488;
    }
    .content {
      padding: 32px 24px;
    }
    .digest-title {
      font-size: 18px;
      font-weight: 800;
      color: #0F172A;
      margin-top: 0;
      margin-bottom: 8px;
    }
    .digest-subtitle {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      padding-bottom: 6px;
      border-bottom: 1px solid #E2E8F0;
      margin-top: 24px;
      margin-bottom: 14px;
    }
    .notification-item {
      padding: 12px 16px;
      background-color: #F8FAFC;
      border: 1px solid #F1F5F9;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .item-title {
      font-size: 13px;
      font-weight: 700;
      color: #0F172A;
      margin: 0;
    }
    .item-time {
      font-size: 10px;
      color: #94A3B8;
      font-weight: 600;
    }
    .item-body {
      font-size: 12px;
      line-height: 1.5;
      color: #475569;
      margin: 4px 0 8px 0;
    }
    .item-link {
      font-size: 11px;
      font-weight: 700;
      color: #0D9488;
      text-decoration: none;
    }
    .footer {
      background-color: #F8FAFC;
      padding: 24px;
      text-align: center;
      font-size: 11px;
      color: #94A3B8;
      border-top: 1px solid #E2E8F0;
    }
    .footer p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-logo">RIPOMA<span>GLOBAL</span></div>
    </div>
    <div class="content">
      <h2 class="digest-title">System Activity Digest</h2>
      <p class="digest-subtitle">Hello {{user}}, here is a summary of your recent unread alerts and system updates.</p>
      
      {{digestItems}}
    </div>
    <div class="footer">
      <p>This is a digest email notification sent based on your account alert preferences.</p>
      <p>&copy; 2026 RIPOMA GLOBAL Ltd. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
