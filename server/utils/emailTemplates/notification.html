<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RIPOMA GLOBAL Notification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      color: #334155;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background-color: #0F172A;
      padding: 24px;
      text-align: center;
      border-bottom: 3px solid #0D9488;
    }
    .header-logo {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
    }
    .header-logo span {
      color: #0D9488;
    }
    .content {
      padding: 32px 24px;
    }
    .severity-badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .severity-info { background-color: #F0F9FF; color: #0369A1; border: 1px solid #BAE6FD; }
    .severity-success { background-color: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; }
    .severity-warning { background-color: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .severity-error { background-color: #FEF2F2; color: #B91C1C; border: 1px solid #FEE2E2; }
    .title {
      font-size: 18px;
      font-weight: 800;
      color: #0F172A;
      margin-top: 0;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .body {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 28px;
    }
    .action-btn {
      display: inline-block;
      background-color: #0D9488;
      color: #FFFFFF !important;
      text-decoration: none;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.2s;
    }
    .footer {
      background-color: #F8FAFC;
      padding: 24px;
      text-align: center;
      font-size: 11px;
      color: #94A3B8;
      border-t: 1px solid #E2E8F0;
    }
    .footer p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-logo">RIPOMA<span>GLOBAL</span></div>
    </div>
    <div class="content">
      <span class="severity-badge severity-{{severity}}">{{severity}}</span>
      <h2 class="title">{{title}}</h2>
      <p class="body">{{body}}</p>
      {{actionButton}}
    </div>
    <div class="footer">
      <p>This is an automated system alert from RIPOMA GLOBAL Platform.</p>
      <p>&copy; 2026 RIPOMA GLOBAL Ltd. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
